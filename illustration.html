<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illustration - Chirantan Biswas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="short-films-page illustration-page">
    <div class="short-films-background" aria-hidden="true">
        <div class="short-films-bg illustration-bg--3"></div>
    </div>
    <main class="short-films-gallery illustration-gallery">
        <a class="short-films-back" href="index.html">&larr; BACK HOME</a>
        <div class="college-time-heading">
            <h1>ILLUSTRATION</h1>
            <p class="illustration-label">DRAWINGS &amp; DIGITAL ART</p>
        </div>
        <div class="college-time-gallery illustration-grid" aria-label="Illustration gallery">
            <button class="college-time-box" type="button" data-image="Illustrations/illustration_1.png" aria-label="Open Illustration image one"></button>
            <button class="college-time-box" type="button" data-image="Illustrations/%7Fillustration_2.jpg" aria-label="Open Illustration image two"></button>
            <button class="college-time-box" type="button" data-image="Illustrations/illustration_3.png" aria-label="Open Illustration image three"></button>
            <button class="college-time-box" type="button" data-image="Illustrations/illustration_4.png" aria-label="Open Illustration image four"></button>

            <button class="college-time-box" type="button" data-image="Illustrations/illustration_12.png" aria-label="Open Illustration image twelve"></button>

            <button class="college-time-box" type="button" data-image="Illustrations/illustration_15.png" aria-label="Open Illustration image fifteen"></button>

    <div class="college-time-lightbox" hidden>
        <button class="college-time-lightbox-close" type="button" aria-label="Close image viewer">&times;</button>
        <button class="college-time-lightbox-arrow college-time-lightbox-arrow--prev" type="button" aria-label="Previous image"></button>
        <img class="college-time-lightbox-image" alt="Illustration gallery image">
        <button class="college-time-lightbox-arrow college-time-lightbox-arrow--next" type="button" aria-label="Next image"></button>
    </div>
    <script src="illustration.js"></script>

</html>
